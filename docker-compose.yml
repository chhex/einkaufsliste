# Projektname per COMPOSE_PROJECT_NAME ueberschreibbar (z.B. in .env), damit
# mehrere Klone/Varianten nebeneinander laufen koennen: jeder Projektname
# bekommt eigene Container und ein eigenes DB-Volume.
name: ${COMPOSE_PROJECT_NAME:-einkaufsliste-local}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-einkaufsliste}
      # Admin-User: besitzt das Schema, wird von Flyway fuer Migrationen genutzt.
      # Entspricht dem, was eine gemanagte DB (z.B. Render) automatisch
      # bereitstellen wuerde.
      POSTGRES_USER: ${DB_ADMIN_USER:?bitte .env aus .env.example erstellen}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?bitte .env aus .env.example erstellen}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - einkaufsliste-db-data-local:/var/lib/postgresql/data
      - ./backend/db-init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-einkaufsliste_admin} -d ${DB_NAME:-einkaufsliste}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-einkaufsliste}
      DB_ADMIN_USER: ${DB_ADMIN_USER:?bitte .env aus .env.example erstellen}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?bitte .env aus .env.example erstellen}
      DB_APP_USER: ${DB_APP_USER:?bitte .env aus .env.example erstellen}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?bitte .env aus .env.example erstellen}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production-32bytes-min}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  einkaufsliste-db-data-local:
