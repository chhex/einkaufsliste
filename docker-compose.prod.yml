services:
  db:
    image: postgres:17-alpine
    container_name: einkaufsliste-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-einkaufsliste}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    # Kein "ports: - 5432:5432" mehr nötig, da das Backend im selben Netz ist!
    volumes:
      - einkaufsliste-db-data:/var/lib/postgresql/data
      - ./backend/db-init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME:-einkaufsliste}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: einkaufsliste-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-einkaufsliste}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"

  caddy:
      image: caddy:2-alpine
      container_name: caddy-ssl
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile
        - frontend_dist:/srv
        - caddy_data:/data
        - caddy_config:/config
      depends_on:
        - backend

  # Baut das Frontend bei jedem Deployment im Docker-Container vor
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: pitcher-frontend-builder:latest
    command: echo "Frontend built successfully"
    volumes:
      - frontend_dist:/srv


volumes:
  einkaufsliste-db-data:
  frontend_dist:
  caddy_data:
  caddy_config: