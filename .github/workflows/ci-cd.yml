name: CI/CD

# EIN Workflow: deploy braucht IMMER einen erfolgreichen test-Job.
# test laeuft auf GitHub-Runnern (Testcontainers, Maven), deploy auf dem
# Self-hosted Runner auf NUC 2 (Keller), hinter Cloudflare Tunnel "nuc2".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test (inkl. Testcontainers-Integrationstests)
        run: mvn -B clean verify

  deploy:
    needs: test
    runs-on: [self-hosted, Linux, nuc2]
    concurrency:
      group: deploy-comprarli
      cancel-in-progress: false
    env:
      COMPOSE: docker compose -f docker-compose.nuc.yml --env-file /opt/comprarli/.env

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: DB starten und App-User sicherstellen
        # bootstrap-app-user.sh ist idempotent (IF NOT EXISTS, GRANTs) und
        # laeuft deshalb bei jedem Deploy - ersetzt das manuelle bootstrap-prod.sh.
        run: |
          set -e
          $COMPOSE up -d --wait db
          set -a; . /opt/comprarli/.env; set +a
          docker exec \
            -e APP_DB_USER="$DB_APP_USER" -e APP_DB_PASSWORD="$DB_APP_PASSWORD" \
            einkaufsliste-db sh -c \
            'PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB" /scripts/bootstrap-app-user.sh'

      - name: Build & Start
        run: |
          set -e
          $COMPOSE up --build -d --remove-orphans
          docker image prune -f

      - name: Smoke-Test (Backend-Health und Frontend)
        run: |
          for i in $(seq 1 45); do
            if docker exec einkaufsliste-backend wget -qO- http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Backend UP"; break
            fi
            sleep 2
          done
          docker exec einkaufsliste-backend wget -qO- http://localhost:8080/actuator/health | grep -q '"UP"'
          curl -fsS -o /dev/null http://127.0.0.1:8082/ && echo "Frontend OK"
