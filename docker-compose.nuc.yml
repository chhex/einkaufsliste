# Deployment auf NUC 2 (Keller) hinter Cloudflare Tunnel "nuc2".
#
# Unterschiede zu docker-compose.prod.yml (Hetzner):
# - Kein HTTPS/Certbot: Cloudflare terminiert TLS, der Tunnel holt die Seite
#   lokal auf 127.0.0.1:8082 ab. Keine offenen Ports nach aussen.
# - Postgres hat keinen Port, nur im internen Docker-Netz erreichbar.
# - Secrets kommen aus /opt/comprarli/.env (via --env-file, siehe ci-cd.yml).
name: einkaufsliste

services:
  db:
    image: postgres:17-alpine
    container_name: einkaufsliste-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-einkaufsliste}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - einkaufsliste-db-data:/var/lib/postgresql/data
      - ./backend/db-init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME:-einkaufsliste}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  backend:
    build:
      context: ./backend
    container_name: einkaufsliste-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-einkaufsliste}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Deaktiviert DevLoginController komplett (siehe @Profile("!prod")).
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: einkaufsliste-frontend
    restart: always
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - backend
    volumes:
      # Ersetzt die default.conf von nginx, damit nur unsere Konfiguration gilt
      - ./frontend/comprarli.nuc.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net

volumes:
  einkaufsliste-db-data:

networks:
  app-net:
    driver: bridge
