spring:
  application:
    name: einkaufsliste-backend

  # Laufzeit-Verbindung: eingeschraenkter Schema-/App-User (nur DML, keine DDL-Rechte)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/einkaufsliste}
    username: ${DB_APP_USER:einkaufsliste_app}
    password: ${DB_APP_PASSWORD:einkaufsliste_app}

  jpa:
    hibernate:
      ddl-auto: validate   # Schema wird ausschliesslich ueber Flyway verwaltet
    open-in-view: false

  # Migrationen laufen ueber den Admin-User, der das Schema besitzt
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/einkaufsliste}
    user: ${DB_ADMIN_USER:einkaufsliste_admin}
    password: ${DB_ADMIN_PASSWORD:einkaufsliste_admin}

server:
  port: ${PORT:8080}

app:
  jwt:
    # ACHTUNG: Default nur fuer lokale Entwicklung - in Produktion (Render)
    # MUSS JWT_SECRET als eigene, zufaellige, geheime Env-Var gesetzt werden.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  google:
    # Google-Cloud-OAuth2-Client-ID (Web Application), autorisiert fuer die
    # Frontend-Origin. Wird gebraucht, um zu verifizieren, dass ein
    # eingehendes Google-ID-Token wirklich fuer UNSERE App ausgestellt wurde.
    client-id: ${GOOGLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,info
