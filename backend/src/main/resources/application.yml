spring:
  application:
    name: einkaufsliste-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/einkaufsliste}
    username: ${DB_USER:einkaufsliste}
    password: ${DB_PASSWORD:einkaufsliste}

  jpa:
    hibernate:
      ddl-auto: validate   # Schema wird ausschliesslich ueber Flyway verwaltet
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,flyway,info
