# nginx-Konfiguration fuer NUC 2 (siehe docker-compose.nuc.yml).
# Nur HTTP: TLS terminiert Cloudflare, der Tunnel "nuc2" liefert die
# Requests an 127.0.0.1:8082 -> hier Port 80.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Echte Client-IP liefert Cloudflare im Header CF-Connecting-IP
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Der Browser spricht HTTPS mit Cloudflare, auch wenn hier HTTP ankommt
        proxy_set_header X-Forwarded-Proto https;
    }
}
