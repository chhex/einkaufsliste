server {
    listen 80;
    server_name static.172.224.90.157.clients.your-server.de localhost;
    # Alles von HTTP automatisch auf HTTPS umleiten
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name static.172.224.90.157.clients.your-server.de localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Frontend Routing für SPA (Svelte)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Weiterleitung an das Spring Boot Backend
    location /api/ {
        proxy_pass http://einkaufsliste-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
